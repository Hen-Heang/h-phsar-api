# project-meta — H-Phsar 도메인 키워드 사전
#
# 소비처:
#   code-investigator  — keywordExpansion (topicHints 매칭·키워드 추출)
#   security-auditor   — securityKeywords (취약점 패턴 검색)

keywordExpansion:
  categories:
    - name: 인증-계정관리
      protocol: [JWT, OTP, BCrypt]
      function: [login, register, refreshAccessToken, changePassword, generateOtp, activateAccount]
      data: [email, password, refreshToken, otpCode, isVerified]
    - name: 구매자-주문
      protocol: [REST]
      function: [addProductToCart, confirmOrder, cancelOrder, markOrderAsArrived]
      data: [cartId, orderId, storeId, qty, orderStatus]
    - name: 공급자-재고주문이행
      protocol: [REST]
      function: [importProduct, publishProduct, acceptPendingOrder, declinePendingOrder, finishPreparing]
      data: [storeProductId, qty, price, orderId, storeId]
    - name: 스토어-탐색
      protocol: [REST]
      function: [getStoresBySearch, bookmarkStoreById, ratingStoreById]
      data: [storeId, categoryId, ratedStar]

  koreanMap:
    인증: [auth, login, jwt, otp]
    계정: [account, user, appUser]
    주문: [order, cart]
    재고: [stock, qty, storeProductDetail]
    스토어: [store]
    상품: [product]
    카테고리: [category]
    알림: [notification]
    리포트: [report]

  usageRules:
    - "topicHints 각 항목을 카테고리에 매칭 (한글 우선, 영문 fallback)."
    - "매칭 카테고리의 3관점에서 최소 2개씩 추출 (총 6+개)."
    - "Grep -i 다중 패턴으로 controller·service·mapper 교차 검색."

securityKeywords:
  categories:
    - name: 인증·인가
      groups:
        "인증": [auth, jwt, token, bcrypt, passwordEncoder]
        "인가": [role, roleId, ownership, EXISTS]
        "OTP": [otp, generateOtp, activateAccount, rateLimit]
    - name: 동시성·무결성
      groups:
        "상태전이가드": [updateStatusIfCurrent, rowsAffected, ConflictException]
        "재고가드": [checkStock, deductStock, "qty >="]
    - name: 입력검증
      groups:
        "정렬화이트리스트": [validColumns, allowlist]
        "SQL치환": ["${", "startDate", "endDate"]

  gapTriggers:
    - pattern: "SupplierReportMapper.xml의 ${startDate}/${endDate} 문자열 치환"
      label: "레거시 SQL 문자열 치환 — 사용자 입력 유입 경로 확인 필요"
    - pattern: "SupplierOrderController.orderDelivered — 항상 ForbiddenException"
      label: "레거시 라우트 — 구버전 클라이언트 호환용으로만 존재, 신규 기능 추가 금지"

  usageRules:
    - "primary + 공통유틸 + related 디렉토리를 대상으로 다중 패턴 Grep 1회 교차."
    - "evidence 는 file:line + 1줄 인용 + 카테고리 라벨."
    - "결과 ≤15건."
