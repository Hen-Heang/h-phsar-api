services:
  - type: web
    name: h-phsar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      # Pinned explicitly: application.yaml's base profile ("local") falls
      # back to localhost/guessable defaults for local-dev convenience — this
      # must never be the profile Render actually runs under.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: FILE_UPLOAD_DIR
        value: /var/lib/h-phsar/uploads
    disk:
      # Persists uploaded files (see FileController/WebMvcConfig) across
      # deploys and restarts — without this, Render's container filesystem
      # is ephemeral and every redeploy wipes FILE_UPLOAD_DIR. A disk pins
      # the service to a single instance (no autoscaling), which is already
      # the case here since Render disks don't support horizontal scaling.
      name: h-phsar-uploads
      mountPath: /var/lib/h-phsar/uploads
      sizeGB: 1
