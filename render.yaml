services:
  - type: web
    name: h-phsar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      # Pinned explicitly: application.yaml's base profile ("local") falls
      # back to localhost/guessable defaults for local-dev convenience — this
      # must never be the profile Render actually runs under.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: FILE_UPLOAD_DIR
        value: /var/lib/h-phsar/uploads
