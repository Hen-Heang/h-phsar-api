# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
# No key below has a default value. Every one of them must come from a real
# environment variable or secret manager in the deployment environment; the
# application is expected to fail to start otherwise, on purpose.

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.henheang.hphsar: INFO

# NOT addressed by this file (documented here rather than silently assumed):
#   config.DatabaseInitializer currently runs its schema-altering @PostConstruct
#   logic unconditionally in every profile, including this one — there is no
#   profile check or property flag guarding it yet. Adding one means changing
#   DatabaseInitializer.java itself, which touches the in-flight Supplier/Buyer
#   migration this file's step was told to preserve untouched. Treat this as a
#   known gap for a dedicated schema/Flyway step, not something already solved
#   by selecting this profile.
#
# file.upload-dir / FILE_UPLOAD_DIR were removed: uploaded files are now stored
# as bytea rows in tb_file (see DatabaseInitializer#createFileStorageTable),
# not on local disk, since this profile's filesystem is not guaranteed durable.
