name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runs the full lifecycle: unit tests (surefire) then the *IT
      # Testcontainers integration tests (failsafe). Testcontainers talks to
      # the Docker daemon that ubuntu-latest runners already have installed —
      # no docker-compose/services block needed, it starts its own disposable
      # Postgres container per AbstractIntegrationTest subclass.
      - name: Build and verify (unit + integration tests)
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Render deploys from the Dockerfile, so build the image here too —
      # a broken Dockerfile should fail the PR, not the deploy. Build only;
      # nothing is pushed to a registry.
      - name: Build Docker image
        run: docker build --tag h-phsar-api:ci .
